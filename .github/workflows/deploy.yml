name: Deploy VideoSrtSearchSystem to Production

on:
  push:
    branches:
      - main
      - master
      - test
    paths-ignore:
      - '*.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
      - master
      - test
    paths-ignore:
      - '*.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy environment'
        required: true
        default: 'production'
        type: choice
        options:
        - production
        - staging

env:
  DOTNET_VERSION: '8.0.x'
  BUILD_CONFIGURATION: 'Release'
  SERVER_IP: '141.147.189.109'
  APP_NAME: 'videosrtsearch'

jobs:
  # SSH 連接檢查階段 - 使用 Windows self-hosted runner
  ssh-connection-check:
    name: Check SSH Connection
    runs-on: self-hosted
    environment: production
    steps:
      - name: 🔗 Test SSH connection
        shell: powershell
        run: |
          Write-Host "🚀 Testing SSH connection to $env:SERVER_IP..."
          
          # 檢查是否有 SSH 客戶端
          if (-not (Get-Command ssh -ErrorAction SilentlyContinue)) {
            Write-Host "❌ SSH client not found. Please install OpenSSH client."
            Write-Host "💡 Install with: Add-WindowsCapability -Online -Name OpenSSH.Client~~~~0.0.1.0"
            exit 1
          }
          
          # 創建臨時 SSH 私鑰檔案
          $tempDir = [System.IO.Path]::GetTempPath()
          $tempKey = Join-Path $tempDir "ssh_key_$(Get-Random)"
          
          try {
            # 將私鑰寫入臨時檔案
            ${{ secrets.SERVER_SSH_KEY }} | Out-File -FilePath $tempKey -Encoding UTF8 -NoNewline

            # 設定檔案權限（Windows 模式）
            $acl = Get-Acl $tempKey
            $acl.SetAccessRuleProtection($true, $false)
            $accessRule = New-Object System.Security.AccessControl.FileSystemAccessRule($env:USERNAME, "FullControl", "Allow")
            $acl.SetAccessRule($accessRule)
            Set-Acl $tempKey $acl
            
            # 測試 SSH 連接
            $sshPort = if ($env:SERVER_SSH_PORT) { $env:SERVER_SSH_PORT } else { "22" }
            $sshUser = "deployer@$env:SERVER_IP"
            $sshCommand = "echo 'SSH connection successful' && uname -a && date && df -h / | tail -1 && free -h | head -2"

            Write-Host "🔄 Attempting SSH connection..."
            Write-Host "Debug: SSH Key Path: $tempKey"
            Write-Host "Debug: SSH Port: $sshPort"
            Write-Host "Debug: SSH User: $sshUser"
            
            # 使用陣列形式傳遞參數給 SSH
            $sshArgs = @(
              "-i", $tempKey,
              "-o", "StrictHostKeyChecking=no",
              "-o", "UserKnownHostsFile=/dev/null",
              "-o", "ConnectTimeout=10",
              "-o", "BatchMode=yes",
              "-p", $sshPort,
              $sshUser,
              $sshCommand
            )
            
            $sshResult = & ssh @sshArgs 2>&1
            Write-Host "Debug leo1"
            if ($LASTEXITCODE -eq 0) {
              Write-Host "✅ SSH connection test passed!"
              Write-Host "📋 Server information:"
              Write-Host $sshResult
            } else {
              Write-Host "❌ SSH connection test failed!"
              Write-Host "🔍 Error details:"
              Write-Host "Exit code: $LASTEXITCODE"
              Write-Host $sshResult
              exit 1
            }
          }
          catch {
            Write-Host "❌ SSH connection test failed with error: $_"
            exit 1
          }
          finally {
            # 清理臨時檔案
            if (Test-Path $tempKey) {
              # Remove-Item $tempKey -Force -ErrorAction SilentlyContinue
            }
          }

  # 建置和測試階段
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: ssh-connection-check
    environment: production
    
    steps:
    - name: 🛎️ Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: 🔧 Setup .NET ${{ env.DOTNET_VERSION }}
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: 📦 Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
          
    - name: 🔄 Restore dependencies
      run: dotnet restore
      
    - name: 🏗️ Build solution
      run: dotnet build --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore --verbosity minimal
      
    - name: 🧪 Run tests (if any exist)
      run: |
        if find . -name "*Test*.csproj" -o -name "*.Test.csproj" -o -name "Test*.csproj" | grep -q .; then
          dotnet test --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --verbosity normal --logger trx --collect:"XPlat Code Coverage"
        else
          echo "No test projects found, skipping tests"
        fi
        
    - name: 📊 Code Coverage Report
      if: success()
      run: |
        if find . -name "*Test*.csproj" -o -name "*.Test.csproj" -o -name "Test*.csproj" | grep -q .; then
          dotnet tool install -g dotnet-reportgenerator-globaltool || true
          reportgenerator -reports:**/coverage.cobertura.xml -targetdir:./coverage -reporttypes:HtmlInline_AzurePipelines
        fi
        
    - name: 📦 Publish application
      run: |
        dotnet publish VideoSrtSearchSystem/VideoSrtSearchSystem.csproj \
          --configuration ${{ env.BUILD_CONFIGURATION }} \
          --no-restore \
          --output ./publish \
          --self-contained false \
          --verbosity minimal
          
    - name: 📤 Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: published-app
        path: ./publish
        retention-days: 1

  # Docker 建置階段  
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: 🛎️ Checkout code
      uses: actions/checkout@v4
      
    - name: 🐳 Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: 🏗️ Build Docker image
      run: |
        docker build \
          --tag ${{ env.APP_NAME }}:latest \
          --tag ${{ env.APP_NAME }}:${{ github.sha }} \
          --build-arg BUILD_CONFIGURATION=${{ env.BUILD_CONFIGURATION }} \
          --file Dockerfile \
          .
          
    - name: 🔍 Test Docker image
      run: |
        docker run --rm -d \
          --name test-container \
          -p 8080:80 \
          -e ASPNETCORE_ENVIRONMENT=Production \
          ${{ env.APP_NAME }}:latest
        
        # 等待容器啟動
        sleep 30
        
        # 測試健康檢查端點
        if curl -f http://localhost:8080/health; then
          echo "✅ Health check passed"
        else
          echo "❌ Health check failed"
          docker logs test-container
          exit 1
        fi
        
        docker stop test-container
        
    - name: 💾 Save Docker image
      run: |
        docker save ${{ env.APP_NAME }}:latest | gzip > ${{ env.APP_NAME }}.tar.gz
        
    - name: 📤 Upload Docker image artifact
      uses: actions/upload-artifact@v4
      with:
        name: docker-image
        path: ${{ env.APP_NAME }}.tar.gz
        retention-days: 1

  # 部署到生產環境
  deploy-production:
    name: Deploy to Production
    runs-on: self-hosted
    needs: [build-and-test, build-docker]
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/test')) || (github.event_name == 'workflow_dispatch')
    environment: production
    
    steps:
    - name: 🛎️ Checkout code
      uses: actions/checkout@v4
      
    - name: 📥 Download Docker image
      uses: actions/download-artifact@v4
      with:
        name: docker-image
        
    - name: 🚀 Deploy to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ env.SERVER_IP }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_SSH_PORT || 22 }}
        source: "${{ env.APP_NAME }}.tar.gz,docker-compose.prod.yml"
        target: "/home/${{ secrets.SERVER_USERNAME }}/${{ env.APP_NAME }}"
        timeout: 300s
        
    - name: 🔄 Execute deployment on server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ env.SERVER_IP }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_SSH_PORT || 22 }}
        timeout: 300s
        script: |
          set -e
          cd /home/${{ secrets.SERVER_USERNAME }}/${{ env.APP_NAME }}
          
          echo "🔍 Current directory: $(pwd)"
          echo "📁 Files in directory:"
          ls -la
          
          # 備份當前運行的容器（如果存在）
          if docker-compose -f docker-compose.prod.yml ps | grep -q ${{ env.APP_NAME }}; then
            echo "📦 Creating backup of current deployment..."
            docker tag ${{ env.APP_NAME }}:latest ${{ env.APP_NAME }}:backup-$(date +%Y%m%d-%H%M%S) || true
          fi
          
          # 載入新的 Docker 映像
          echo "📥 Loading new Docker image..."
          docker load < ${{ env.APP_NAME }}.tar.gz
          
          # 驗證映像載入成功
          if ! docker images | grep -q ${{ env.APP_NAME }}; then
            echo "❌ Failed to load Docker image"
            exit 1
          fi
          
          # 停止現有容器
          echo "🛑 Stopping existing containers..."
          docker-compose -f docker-compose.prod.yml down || true
          
          # 啟動新容器
          echo "🚀 Starting new containers..."
          docker-compose -f docker-compose.prod.yml up -d
          
          # 等待服務啟動並進行健康檢查
          echo "⏳ Waiting for service to start..."
          sleep 45
          
          # 健康檢查
          max_attempts=10
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            if curl -f http://localhost/health >/dev/null 2>&1; then
              echo "✅ Health check passed on attempt $attempt"
              break
            else
              echo "⏳ Health check failed on attempt $attempt/$max_attempts, retrying in 10 seconds..."
              if [ $attempt -eq $max_attempts ]; then
                echo "❌ Health check failed after $max_attempts attempts"
                echo "📋 Container logs:"
                docker-compose -f docker-compose.prod.yml logs --tail=50
                exit 1
              fi
              sleep 10
              attempt=$((attempt + 1))
            fi
          done
          
          # 清理舊映像（保留最新的3個版本）
          echo "🧹 Cleaning up old Docker images..."
          docker images ${{ env.APP_NAME }} --format "table {{.Tag}}\t{{.ID}}" | grep -v "latest\|backup" | tail -n +4 | awk '{print $2}' | xargs -r docker rmi || true
          docker image prune -f || true
          
          # 清理上傳的檔案
          echo "🧹 Cleaning up uploaded files..."
          rm -f ${{ env.APP_NAME }}.tar.gz
          
          echo "✅ Deployment completed successfully!"
          echo "🌐 Application is available at: http://${{ env.SERVER_IP }}"
          echo "🔍 Health check: http://${{ env.SERVER_IP }}/health"
          
  # 部署後驗證
  post-deploy-verification:
    name: Post-deployment Verification
    runs-on: ubuntu-latest
    needs: deploy-production
    if: success()
    
    steps:
    - name: 🔍 Verify deployment
      run: |
        echo "🔍 Verifying deployment..."
        
        # 測試健康檢查端點
        if curl -f http://${{ env.SERVER_IP }}/health; then
          echo "✅ Health check endpoint is working"
        else
          echo "❌ Health check endpoint failed"
          exit 1
        fi
        
        # 測試主頁面
        if curl -f http://${{ env.SERVER_IP }} >/dev/null 2>&1; then
          echo "✅ Main page is accessible"
        else
          echo "❌ Main page is not accessible"
          exit 1
        fi
        
        echo "✅ All verification checks passed!"
        
    - name: 📧 Notify deployment success
      if: success()
      run: |
        echo "✅ Deployment verification successful!"
        echo "🚀 VideoSrtSearchSystem has been deployed successfully to production"
        echo "🌐 URL: http://${{ env.SERVER_IP }}"
        echo "📅 Deployed at: $(date)"
        echo "🔖 Commit: ${{ github.sha }}"